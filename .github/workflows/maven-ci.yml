name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 
    steps:
    # 1. Checkout mã nguồn từ repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Thực thi Maven Build Lifecycle (compile, test, package)
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # 4. Lưu trữ file .jar (Artifact) sau khi build thành công
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: result-jar
        path: target/*.jar